## Gradle memory/performance
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

## Configuration cache is intentionally disabled for Phase 1 to stay on the
## well-understood classic AGP DSL path. Re-enable after the AGP 9 migration is verified.
org.gradle.configuration-cache=false

## AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

## AGP 9 ships "built-in Kotlin". Phase 1 explicitly opts out to use the classic
## Kotlin Android Plugin + KSP model. These flags are honored until AGP 10.
android.builtInKotlin=false
android.newDsl=false

## Kotlin
kotlin.code.style=official

## KSP
ksp.incremental=true
ksp.useKSP2=true